name: UI Template Analyze

on:
  push:
    branches:
      - ui-template-safe

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daftar_al_hisab_template
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
