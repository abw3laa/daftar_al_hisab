allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Some Flutter plugins ship with an outdated compileSdkVersion pinned in
// their own android/build.gradle. When a newer transitive androidx
// dependency (pulled in by another plugin) references a resource that only
// exists starting at a higher API level (e.g. android:attr/lStar, added in
// API 31), resource linking fails for that plugin even though the app
// module itself compiles against a recent SDK. Force every Android library
// subproject to compile against the same SDK as the app to avoid this.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 35
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
