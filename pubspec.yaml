name: daftar_al_hisab
description: "دفتر الحساب - تطبيق لإدارة يوميات العمال والورشات والمدفوعات"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  intl: any
  google_fonts: ^6.2.1
  share_plus: ^11.0.0
  pdf: ^3.11.0
  printing: ^5.14.2
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.2.3
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  file_picker: ^8.1.4
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#091426"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
